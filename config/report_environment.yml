# Report env for the QA/report stage (ngidf/qa/) and the QC package (ngidf/package/). Kept separate from the runs env so report changes
# never change the fingerprint of the model runs. Exact build: config/report_environment.lock.txt.
name: ngidf-report
channels: [conda-forge]
dependencies:
  - python=3.12
  - numpy
  - pandas
  - netcdf4
  - matplotlib-base
  - weasyprint      # the QC package PDF (ngidf/package/)
  - markdown
